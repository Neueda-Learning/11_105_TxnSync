<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script>(function(){var d=document.documentElement;var t=localStorage.getItem('txnsync-theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');d.setAttribute('data-theme',t);var fs=localStorage.getItem('txnsync-font-size');if(fs)d.setAttribute('data-font-size',fs);if(localStorage.getItem('txnsync-contrast')==='true')d.setAttribute('data-contrast','high');if(localStorage.getItem('txnsync-motion')==='true')d.setAttribute('data-reduced-motion','true');})();</script>
  <title>Accounts · TxnSync</title>
  <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
  <link rel="stylesheet" href="../css/style.css" />
  <link rel="stylesheet" href="../css/components.css" />
</head>
<body data-page="accounts" data-title="Accounts" data-subtitle="Accounts linked to the TxnSync monitoring network" data-root="../">

  <section class="card">
    <div class="card-header">
      <div class="card-header-titles">
        <h2>All Accounts</h2>
        <p>Every account registered in the network</p>
      </div>
      <button class="btn btn-primary" id="newAccountBtn"><i class="fa-solid fa-plus"></i> New Account</button>
    </div>
    <div class="card-body">
      <div class="toolbar">
        <div class="toolbar-search">
          <i class="fa-solid fa-magnifying-glass"></i>
          <input type="text" class="form-control" id="accSearch" placeholder="Search account ID, name, institution…" />
        </div>
        <div class="toolbar-filters">
          <select class="form-control" id="accInstitutionFilter">
            <option value="">All institutions</option>
          </select>
        </div>
      </div>
      <div id="accTableContainer"></div>
    </div>
  </section>

  <script src="../js/api.js"></script>
  <script src="../js/ui.js"></script>
  <script src="../js/table.js"></script>
  <script src="../js/layout.js"></script>
  <script src="../js/accounts.js"></script>
</body>
</html>
