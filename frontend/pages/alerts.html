<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Alerts · TxnSync</title>
  <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
  <link rel="stylesheet" href="../css/style.css" />
  <link rel="stylesheet" href="../css/components.css" />
</head>
<body data-page="alerts" data-title="Alerts" data-subtitle="Alerts generated when transactions trip a monitoring rule" data-root="../">

  <section class="card">
    <div class="card-header">
      <div class="card-header-titles">
        <h2>Alerts by Transaction</h2>
        <p>Alerts are grouped by the transaction that triggered them, since one transaction can trip more than one rule at once</p>
      </div>
    </div>
    <div class="card-body">
      <div class="toolbar">
        <div class="toolbar-search">
          <i class="fa-solid fa-magnifying-glass"></i>
          <input type="text" class="form-control" id="alertSearch" placeholder="Search rule, notes, transaction ID…" />
        </div>
        <div class="toolbar-filters">
          <select class="form-control" id="alertStatusFilter">
            <option value="">All statuses</option>
            <option value="OPEN">Open</option>
            <option value="ACKNOWLEDGED">Acknowledged</option>
            <option value="INVESTIGATING">Investigating</option>
            <option value="CLOSED">Closed</option>
            <option value="DISMISSED">Dismissed</option>
          </select>
          <select class="form-control" id="alertSeverityFilter">
            <option value="">All severities</option>
            <option value="LOW">Low</option>
            <option value="MEDIUM">Medium</option>
            <option value="HIGH">High</option>
            <option value="CRITICAL">Critical</option>
          </select>
          <select class="form-control" id="alertSortBy">
            <option value="recent">Most Recent</option>
            <option value="severity">Highest Severity</option>
            <option value="count">Most Alerts</option>
          </select>
        </div>
      </div>
      <div id="alertGroupsContainer" class="txn-group-list"></div>
      <div class="pagination">
        <div class="pagination-info" id="alertsPaginationInfo"></div>
        <div class="pagination-controls" id="alertsPaginationControls"></div>
      </div>
    </div>
  </section>

  <script src="../js/api.js"></script>
  <script src="../js/ui.js"></script>
  <script src="../js/layout.js"></script>
  <script src="../js/alerts.js"></script>
</body>
</html>
