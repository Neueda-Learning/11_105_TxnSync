spring.application.name=txnSync
# Allow overriding server port via environment variable PORT (fallback 8080)
server.port=${PORT:8080}

# Database Configuration (override via env vars DB_URL, DB_USER, DB_PASS)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/txn_sync_db}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASS:"your password"}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Expose actuator health and enable CORS for the frontend. Allowed origins can be
# overridden with env var ACTUATOR_ALLOWED_ORIGINS (comma-separated).
management.endpoints.web.exposure.include=health
management.endpoints.web.cors.allowed-origins=${ACTUATOR_ALLOWED_ORIGINS:http://127.0.0.1:5501,http://localhost:5501}
management.endpoints.web.cors.allowed-methods=${ACTUATOR_ALLOWED_METHODS:GET,OPTIONS}
management.endpoints.web.cors.allowed-headers=${ACTUATOR_ALLOWED_HEADERS:*}
management.endpoints.web.cors.exposed-headers=${ACTUATOR_EXPOSED_HEADERS:*}

# Application CORS origins (for /api/**) can be overridden with APP_CORS_ORIGINS
# Example: APP_CORS_ORIGINS=http://localhost:3000,http://127.0.0.1:5501
app.cors.origins=${APP_CORS_ORIGINS:*}
